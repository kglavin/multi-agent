[project]
name = "r14-el-farol"
version = "0.1.0"
description = "R14 El Farol: rule-based baseline and LLM agents"
requires-python = ">=3.12"
dependencies = [
    "mesa==3.5.1",
    "networkx==3.5",
    "harness",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
harness = { path = "../harness", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
