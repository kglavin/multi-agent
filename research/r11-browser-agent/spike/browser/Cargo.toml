[package]
name = "browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proto = { path = "../proto", features = ["ts"] }
ractor = "=0.16.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
futures = "0.3"
serde_json = "1"
js-sys = "0.3"
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
