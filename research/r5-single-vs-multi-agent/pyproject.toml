[project]
name = "r5"
version = "0.1.0"
description = "R5 single agent versus multi-agent: corpus, cases, scoring, and tools"
requires-python = ">=3.12"
dependencies = ["harness"]

[tool.uv]
package = false

[tool.uv.sources]
harness = { path = "../harness", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
